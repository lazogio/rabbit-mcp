name: Release

# A `v*` tag (e.g. v0.2.0) builds self-contained binaries for every platform and publishes a
# GitHub Release. Pushing a change to this workflow file only builds (no release), so the
# packaging is verified before the first tag is ever pushed.
on:
  push:
    tags: ['v*']
    branches: ['**']
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, osx-x64, osx-arm64]

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # Self-contained single file: users need no .NET runtime. Not trimmed: the MCP SDK and
      # System.Text.Json rely on reflection over the contract types.
      - name: Publish
        run: >
          dotnet publish src/RabbitMcp.Server -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -o out/rabbit-mcp

      - name: MCP smoke test (single-file binary)
        if: matrix.rid == 'linux-x64'
        run: scripts/smoke-test.sh out/rabbit-mcp/rabbit-mcp

      # The single file also bundles ASP.NET Core for RabbitMcp:Transport=http — prove it serves and authenticates.
      - name: MCP smoke test (single-file binary over HTTP)
        if: matrix.rid == 'linux-x64'
        run: scripts/smoke-test-http.sh out/rabbit-mcp/rabbit-mcp

      # Proves an external contracts DLL binds to the RabbitMcp.Contracts bundled in the single file.
      - name: MCP smoke test (single-file binary + external contracts)
        if: matrix.rid == 'linux-x64'
        env:
          SMOKE_EXPECT_TOOLS: list_contracts,publish_invoice_issued,request_get_invoice
          SMOKE_FORBID_TOOLS: publish_order_submitted
        run: |
          dotnet build tests/RabbitMcp.ExternalContracts -c Release -o external
          RabbitMcp__ContractAssemblies="$PWD/external/RabbitMcp.ExternalContracts.dll" \
            scripts/smoke-test.sh out/rabbit-mcp/rabbit-mcp

      - name: Package
        shell: bash
        run: |
          name="rabbit-mcp-${{ steps.version.outputs.version }}-${{ matrix.rid }}"
          cp README.md LICENSE out/rabbit-mcp/
          cd out
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            zip -qr "$name.zip" rabbit-mcp
          else
            tar -czf "$name.tar.gz" rabbit-mcp
          fi
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: |
            out/*.zip
            out/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  pack:
    name: Pack RabbitMcp.Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pack
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          dotnet pack src/RabbitMcp.Contracts -c Release -p:Version="$v" -o out

      - uses: actions/upload-artifact@v7
        with:
          name: package-contracts-nupkg
          path: out/*.nupkg
          if-no-files-found: error
          retention-days: 7

  # Multi-arch image; pushed to ghcr.io only for tags (branch runs prove it builds for both platforms).
  docker:
    name: Docker image (ghcr.io)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}

  release:
    name: GitHub Release
    needs: [build, pack, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # Optional repository secret; without it the package is only attached to the GitHub Release.
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Works for a pushed tag and for a release drafted in the GitHub UI (which creates the tag itself):
      # an existing release just gets the assets attached.
      - name: Create release (or attach to an existing one)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes \
              $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
          fi

      - name: Publish RabbitMcp.Contracts to nuget.org
        if: env.NUGET_API_KEY != ''
        run: >
          dotnet nuget push dist/*.nupkg
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
