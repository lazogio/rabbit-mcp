name: Release

# Release: Actions → Release → Run workflow (on main), pick patch/minor/major. The `version` job takes the latest
# vX.Y.Z tag, creates the next one and every job below publishes it (binaries, image, NuGet, GitHub Release, MCP
# registry). Pushing a vX.Y.Z (or vX.Y.Z-pre) tag by hand works too; other tags (V1.0.1, v.1.0.1) are ignored.
# Pushing a change to this workflow file only builds (no release), so the packaging is verified first.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
    branches: ['**']
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      bump:
        description: Next version from the latest vX.Y.Z tag
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write      # pushes the new tag (Run workflow only)
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A tag pushed with GITHUB_TOKEN starts no second run: this run publishes it.
      - name: Version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo "::error::Run the release from main (this run is on $GITHUB_REF_NAME)."
              exit 1
            fi
            latest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
            IFS=. read -r major minor patch <<< "${latest#v}"
            major=${major:-0} minor=${minor:-0} patch=${patch:-0}
            case "$BUMP" in
              major) major=$((major + 1)) minor=0 patch=0 ;;
              minor) minor=$((minor + 1)) patch=0 ;;
              *)     patch=$((patch + 1)) ;;
            esac
            tag="v$major.$minor.$patch"
            echo "Latest ${latest:-none} → $tag ($BUMP) on $GITHUB_SHA"
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.rid }}
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write      # build provenance attestations (tags only)
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, osx-x64, osx-arm64]

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Self-contained single file: users need no .NET runtime. Not trimmed: the MCP SDK and
      # System.Text.Json rely on reflection over the contract types.
      - name: Publish
        run: >
          dotnet publish src/RabbitMcp.Server -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:Version=${{ needs.version.outputs.version }}
          -o out/rabbit-mcp

      - name: MCP smoke test (single-file binary)
        if: matrix.rid == 'linux-x64'
        run: scripts/smoke-test.sh out/rabbit-mcp/rabbit-mcp

      # The single file also bundles ASP.NET Core for RabbitMcp:Transport=http — prove it serves and authenticates.
      - name: MCP smoke test (single-file binary over HTTP)
        if: matrix.rid == 'linux-x64'
        run: scripts/smoke-test-http.sh out/rabbit-mcp/rabbit-mcp

      # Proves an external contracts DLL binds to the RabbitMcp.Contracts bundled in the single file.
      - name: MCP smoke test (single-file binary + external contracts)
        if: matrix.rid == 'linux-x64'
        env:
          SMOKE_EXPECT_TOOLS: list_contracts,publish_invoice_issued,request_get_invoice
          SMOKE_FORBID_TOOLS: publish_order_submitted
        run: |
          dotnet build tests/RabbitMcp.ExternalContracts -c Release -o external
          RabbitMcp__ContractAssemblies="$PWD/external/RabbitMcp.ExternalContracts.dll" \
            scripts/smoke-test.sh out/rabbit-mcp/rabbit-mcp

      - name: Package
        shell: bash
        run: |
          name="rabbit-mcp-${{ needs.version.outputs.version }}-${{ matrix.rid }}"
          cp README.md README.ka.md LICENSE out/rabbit-mcp/
          cd out
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            zip -qr "$name.zip" rabbit-mcp
          else
            tar -czf "$name.tar.gz" rabbit-mcp
          fi
          ls -la

      # Signed SLSA provenance: `gh attestation verify <file> --repo lazogio/rabbit-mcp` proves which workflow and
      # commit built the archive.
      - name: Attest build provenance
        if: needs.version.outputs.release == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            out/*.zip
            out/*.tar.gz

      # Branch runs only prove the packaging: a full artifact storage quota must not fail them (tags need the upload).
      - uses: actions/upload-artifact@v7
        continue-on-error: ${{ needs.version.outputs.release != 'true' }}
        with:
          name: package-${{ matrix.rid }}
          path: |
            out/*.zip
            out/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  pack:
    name: Pack RabbitMcp.Contracts + SBOM
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: dotnet pack src/RabbitMcp.Contracts -c Release -p:Version=${{ needs.version.outputs.version }} -o out

      # The server as a .NET tool / NuGet MCP server package; its .mcp/server.json carries the release version.
      - name: Pack the server tool (RabbitMcp.Server)
        run: |
          scripts/stamp-server-json.py "${{ needs.version.outputs.version }}"
          dotnet pack src/RabbitMcp.Server -c Release -p:PackAsTool=true -p:Version=${{ needs.version.outputs.version }} -o out

      # Installed exactly as a user would, then driven over MCP stdio.
      - name: MCP smoke test (dotnet tool)
        run: |
          dotnet tool install RabbitMcp.Server --tool-path tool --add-source out --version ${{ needs.version.outputs.version }}
          unzip -l out/RabbitMcp.Server.*.nupkg | grep -q ".mcp/server.json"
          unzip -p out/RabbitMcp.Server.*.nupkg '*.nuspec' | grep -q 'McpServer'
          scripts/smoke-test.sh tool/rabbit-mcp

      # The SBOM lists every NuGet package inside the server (read from deps.json of a framework-dependent publish;
      # the single-file binaries contain the same packages).
      - name: Publish for the SBOM
        run: dotnet publish src/RabbitMcp.Server -c Release -p:Version=${{ needs.version.outputs.version }} -o sbom-input

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: sbom-input
          format: cyclonedx-json
          output-file: out/rabbit-mcp-${{ needs.version.outputs.version }}.sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Check the SBOM
        run: |
          python3 - out/*.sbom.cdx.json <<'PY'
          import json, sys
          components = {c["name"] for c in json.load(open(sys.argv[1]))["components"]}
          expected = {"ModelContextProtocol", "RabbitMQ.Client", "OpenTelemetry"}
          missing = expected - components
          assert not missing, f"SBOM misses {missing} ({len(components)} components)"
          print(f"SBOM: {len(components)} components")
          PY

      - name: Attest build provenance
        if: needs.version.outputs.release == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            out/*.nupkg
            out/*.sbom.cdx.json

      # Branch runs only prove the packaging: a full artifact storage quota must not fail them (tags need the upload).
      - uses: actions/upload-artifact@v7
        continue-on-error: ${{ needs.version.outputs.release != 'true' }}
        with:
          name: package-contracts-nupkg
          path: |
            out/*.nupkg
            out/*.sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

  # Multi-arch image; pushed to ghcr.io only for tags (branch runs prove it builds for both platforms).
  docker:
    name: Docker image (ghcr.io)
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: needs.version.outputs.release == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.version.outputs.release == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.version.outputs.version }}
          # Image SBOM and SLSA provenance, attached to the image in the registry (tags only: nothing is pushed otherwise).
          sbom: ${{ needs.version.outputs.release == 'true' }}
          provenance: ${{ needs.version.outputs.release == 'true' && 'mode=max' || 'false' }}

  release:
    name: GitHub Release
    needs: [version, build, pack, docker]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write      # nuget.org Trusted Publishing

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Works for a pushed tag and for a release drafted in the GitHub UI (which creates the tag itself):
      # an existing release just gets the assets attached.
      - name: Create release (or attach to an existing one)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes \
              $([[ "$TAG" == *-* ]] && echo --prerelease)
          fi

      # nuget.org Trusted Publishing: the GitHub OIDC token is exchanged for a short-lived API key (no secret). The
      # policy on nuget.org (owner lazogio, repository rabbit-mcp, workflow release.yml, RabbitMcp.*) must exist.
      - name: Log in to nuget.org (Trusted Publishing)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || github.repository_owner }}

      # Both packages: RabbitMcp.Contracts and the RabbitMcp.Server tool (an MCP server package on nuget.org).
      - name: Publish the packages to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push dist/*.nupkg
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # Lists the release in the official MCP registry (https://registry.modelcontextprotocol.io) under
  # io.github.lazogio/rabbit-mcp. GitHub OIDC proves the namespace (no secret). The registry checks that the NuGet
  # package exists (README `mcp-name:`) and that the GHCR image is public with the server-name label — before the
  # first release the GHCR package must be switched to public (or re-run this job).
  mcp-registry:
    name: MCP registry
    needs: [version, release]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Version in server.json
        run: |
          scripts/stamp-server-json.py "${{ needs.version.outputs.version }}"

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version || true

      # nuget.org can take 10+ minutes to index a freshly pushed version and the registry rejects the entry until it is
      # there. The registry token from `login` lives only a few minutes, so every attempt logs in again. Any other
      # error (validation, ownership) is final and fails at once instead of retrying.
      - name: Publish to the MCP registry
        working-directory: src/RabbitMcp.Server/.mcp
        run: |
          for attempt in $(seq 1 25); do
            ../../../mcp-publisher login github-oidc
            if out=$(../../../mcp-publisher publish 2>&1); then echo "$out"; exit 0; fi
            echo "$out"
            if ! grep -q "does not exist in the registry" <<< "$out"; then exit 1; fi
            echo "Attempt $attempt: package not indexed on nuget.org yet, retrying in 60 s"
            sleep 60
          done
          exit 1
