name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    # Pinned, so GitHub moving ubuntu-latest does not change the build unannounced (26.04 verified 2026-10-18).
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RabbitMcp.slnx

      - name: Build
        run: dotnet build RabbitMcp.slnx -c Release --no-restore

      # Known-vulnerable NuGet packages (direct or transitive) fail the build.
      - name: Vulnerable packages
        run: |
          dotnet list RabbitMcp.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found (see above)"; exit 1
          fi

      - name: Unit tests
        run: >
          dotnet test tests/RabbitMcp.Tests -c Release --no-build
          --logger "trx;LogFileName=unit.trx"
          --logger GitHubActions
          --results-directory TestResults

      - name: Upload test results
        if: always()
        # Results are also reported as annotations; a full artifact storage quota must not fail the build.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 3

      - name: Publish server
        run: dotnet publish src/RabbitMcp.Server -c Release --no-restore -o out

      - name: MCP smoke test (stdio, real binary)
        run: scripts/smoke-test.sh out/rabbit-mcp

      - name: MCP smoke test (deny policy + audit file)
        env:
          RabbitMcp__PublishDeny: request_*
          RabbitMcp__AuditLogPath: ${{ runner.temp }}/audit/audit.jsonl
          SMOKE_EXPECT_TOOLS: list_contracts,publish_order_submitted,publish_order_cancelled,recent_activity
          SMOKE_FORBID_TOOLS: request_get_order_status
        run: |
          scripts/smoke-test.sh out/rabbit-mcp
          test -f "$RabbitMcp__AuditLogPath"   # created at startup (writability check)

      # OTLP endpoint with nothing listening: the server must start, answer MCP and keep stdout clean.
      - name: MCP smoke test (OpenTelemetry enabled)
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4317
          OTEL_SERVICE_NAME: rabbit-mcp-smoke
        run: scripts/smoke-test.sh out/rabbit-mcp

      # Responder mode with no broker: the listener keeps retrying in the background, MCP still works.
      - name: MCP smoke test (responder mode)
        env:
          RabbitMcp__RespondTo: GetOrderStatus
          SMOKE_EXPECT_TOOLS: list_contracts,pending_requests,reject_request,reply_order_status,reply_order_not_found
        run: scripts/smoke-test.sh out/rabbit-mcp

      - name: MCP smoke test (HTTP transport + API key)
        run: scripts/smoke-test-http.sh out/rabbit-mcp

      - name: MCP smoke test (contracts loaded from an external DLL)
        env:
          RabbitMcp__ContractAssemblies: ${{ github.workspace }}/tests/RabbitMcp.ExternalContracts/bin/Release/net10.0/RabbitMcp.ExternalContracts.dll
          SMOKE_EXPECT_TOOLS: list_contracts,publish_invoice_issued,request_get_invoice
          SMOKE_FORBID_TOOLS: publish_order_submitted,request_get_order_status
        run: scripts/smoke-test.sh out/rabbit-mcp

      - name: Contracts diff (CLI, external DLL against itself)
        run: |
          dll=tests/RabbitMcp.ExternalContracts/bin/Release/net10.0/RabbitMcp.ExternalContracts.dll
          out/rabbit-mcp contracts diff "$dll" "$dll"
          out/rabbit-mcp contracts diff "$dll" "$dll" --json | python3 -c "import json,sys; assert json.load(sys.stdin)['compatible']"
          set +e; out/rabbit-mcp contracts diff "$dll" missing.dll; code=$?; set -e
          test "$code" -eq 2

      - name: Upload server binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: rabbit-mcp-linux-x64
          path: out
          retention-days: 14

  integration:
    name: Integration (RabbitMQ + MassTransit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Integration tests
        run: >
          dotnet test tests/RabbitMcp.IntegrationTests -c Release
          --logger "trx;LogFileName=integration.trx"
          --logger GitHubActions
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        # Results are also reported as annotations; a full artifact storage quota must not fail the build.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 3

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t rabbit-mcp:ci .

      - name: MCP smoke test (container, HTTP + API key)
        run: scripts/smoke-test-http.sh docker:rabbit-mcp:ci

  # The Shop sample as a user runs it (docker compose), walked through over MCP like a model would.
  sample:
    name: Sample (Shop, end to end)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Start the sample
        run: docker compose -f samples/Shop/docker-compose.yml up -d --build --wait

      - name: Walk through it over MCP
        run: python3 scripts/sample-e2e.py http://127.0.0.1:5080/mcp shop-demo-key-change-me-0123456789abcdef

      - name: Logs
        if: failure()
        run: |
          docker compose -f samples/Shop/docker-compose.yml logs --no-color
          for service in shop mcp; do
            docker compose -f samples/Shop/docker-compose.yml logs --no-color --tail 25 "$service" | tail -c 3000 |
              python3 -c "import sys; print('::error title=$service logs::' + sys.stdin.read().replace('%','%25').replace('\n','%0A'))"
          done

      - name: Stop
        if: always()
        run: docker compose -f samples/Shop/docker-compose.yml down -v
