name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RabbitMcp.slnx

      - name: Build
        run: dotnet build RabbitMcp.slnx -c Release --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/RabbitMcp.Tests -c Release --no-build
          --logger "trx;LogFileName=unit.trx"
          --logger GitHubActions
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Publish server
        run: dotnet publish src/RabbitMcp.Server -c Release --no-restore -o out

      - name: MCP smoke test (stdio, real binary)
        run: scripts/smoke-test.sh out/rabbit-mcp

      - name: Upload server binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: rabbit-mcp-linux-x64
          path: out
          retention-days: 14

  integration:
    name: Integration (RabbitMQ + MassTransit)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Integration tests
        run: >
          dotnet test tests/RabbitMcp.IntegrationTests -c Release
          --logger "trx;LogFileName=integration.trx"
          --logger GitHubActions
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: TestResults
          if-no-files-found: ignore
